name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * *'  # Todo dia ao meio-dia UTC (09:00 BRT)
  workflow_dispatch:       # Permite rodar manualmente pelo GitHub

# O job não precisa de nenhuma permissão no repositório
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase (consulta leve ao banco com a anon key pública)
        # Antes usava SUPABASE_ACCESS_TOKEN (token da Management API, com poder total
        # sobre a conta) só para um SELECT 1. A anon key é pública e limitada pelo RLS.
        env:
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://${SUPABASE_PROJECT_REF}.supabase.co/storage/v1/bucket" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}")

          echo "HTTP: $HTTP_CODE"
          if [ "$HTTP_CODE" != "200" ]; then
            echo "Falha ao contatar o Supabase!"
            exit 1
          fi
          echo "Supabase está ativo!"
